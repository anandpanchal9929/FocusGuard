name: Release source verification
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - run: gradle testDebugUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-input
          path: app/build/outputs/apk/release/app-release-unsigned.apk
