name: Android verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source archive on initial browser upload
        if: hashFiles('FocusGuard-source.zip') != ''
        run: |
          unzip -o FocusGuard-source.zip -x '.github/*'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm FocusGuard-source.zip
          git add . ':!.github'
          git commit -m 'Expand complete native Android source'
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-debug
          path: app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: app/build/reports/
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('FocusGuard-source.zip') != ''
        run: unzip -o FocusGuard-source.zip -x '.github/*'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: gradle connectedDebugAndroidTest
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('FocusGuard-source.zip') != ''
        run: unzip -o FocusGuard-source.zip -x '.github/*'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db

  local_signing_input:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FocusGuard-debug
          path: build-input
      - name: Publish unsigned input for local signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j FocusGuard-build-input.zip "$(find build-input -name app-release-unsigned.apk -print -quit)"
          gh release create "build-input-${GITHUB_RUN_ID}" FocusGuard-build-input.zip --prerelease --latest=false --title "Unsigned build input for local signing" --notes "Build input only. Extract and sign locally before installing. The private signing key remains on the owner computer."
